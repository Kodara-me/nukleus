# Builds Nukleus and runs every test for every push to main and every pull request. Ardoise is
# cloned by CMake at its pinned tag; sd-cli and llama.cpp are not needed, the tests use fakes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja qt6-base qt6-websockets qt6-svg qt6-tools libarchive

      - name: Check out
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        # The installer tests refuse to run as root without SUDO_USER, as on a real system.
        run: |
          useradd --create-home tester
          chown -R tester: "$GITHUB_WORKSPACE"
          su tester -c "cd '$GITHUB_WORKSPACE' && QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure"
